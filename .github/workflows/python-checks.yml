name: Adaptive Alpha code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy pandas
      - name: Compile Python modules
        run: python -m compileall -q app.py signals.py comparison.py score_history.py prediction.py research tests
      - name: Check all scoring, comparison, and history tests
        run: python -m unittest discover -s tests -v
